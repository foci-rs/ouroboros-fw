[package]
name = "ouroboros-fw"
version = "0.4.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/foci-rs/ouroboros-fw"

[dependencies]
# RTIC
rtic = { version = "2.2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1", features = ["stm32_tim2", "stm32h723zg"] }
rtic-sync = "1.4"

# Embassy HAL (SPI DMA, USB, GPIO — not the executor)
embassy-stm32 = { version = "0.6", features = [
    "defmt",
    "stm32h723zg",
    "unstable-pac",
    "rt",
    "time-driver-tim4",
] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.6"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

# Cortex-M
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1.2"

# Klipper protocol (ankyra)
ankyra = { git = "https://github.com/foci-rs/ankyra" }
ankyra-macros = { git = "https://github.com/foci-rs/ankyra" }
ankyra-assemble = { git = "https://github.com/foci-rs/ankyra" }

# FOCI crates
foci-firmware = { git = "https://github.com/foci-rs/foci-firmware", default-features = false }
foci-klipper = { git = "https://github.com/foci-rs/foci-klipper" }
foci-tmc4671 = { git = "https://github.com/foci-rs/foci-tmc4671" }
foci-usb-stm32 = { git = "https://github.com/foci-rs/foci-usb-stm32" }

# Logging
defmt = "1.0"
defmt-rtt = "1.1"

# no_std utilities
heapless = { version = "0.9", features = ["defmt"] }

[features]
dev = ["foci-firmware/dev"]
diagnostics = ["foci-firmware/diagnostics"]
dev-flash = []
usb-p1-probe = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Lints that fire in this crate today; drop an entry once its findings are fixed.
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
elidable_lifetime_names = "allow"
fn_params_excessive_bools = "allow"
format_push_string = "allow"
ignored_unit_patterns = "allow"
inline_always = "allow"
items_after_statements = "allow"
large_types_passed_by_value = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnested_or_patterns = "allow"
wildcard_imports = "allow"
